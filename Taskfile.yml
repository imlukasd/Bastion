version: '3'

silent: true

tasks:
  check:
    desc: "Baseline: build, vet, golangci-lint, govulncheck, unit tests (-short), plan check; prints failures only"
    cmds:
      - go run ./scripts/check
  test:
    desc: "Full suite with the race detector (TD §34.1)"
    cmds:
      - go test -race -count=1 ./...
  up:
    desc: "Start the local stack (PostgreSQL, Redis) and wait until it is healthy"
    cmds:
      - docker compose -f deploy/compose.yaml up -d --wait
  down:
    desc: "Stop the local stack; task down -- -v also drops the data volume"
    cmds:
      - docker compose -f deploy/compose.yaml down {{.CLI_ARGS}}
  migrate:
    desc: "Apply the Pay and Tickets migrations as the owner roles (PAY_MIGRATE_URL, TIX_MIGRATE_URL)"
    env:
      # Local stack defaults (P1-02 D7, D12); set the variables to migrate elsewhere.
      PAY_MIGRATE_URL: '{{.PAY_MIGRATE_URL | default "postgres://pay_owner:pay_owner@localhost:55432/bastion_pay?sslmode=disable"}}'
      TIX_MIGRATE_URL: '{{.TIX_MIGRATE_URL | default "postgres://tickets_owner:tickets_owner@localhost:55432/bastion_tickets?sslmode=disable"}}'
    cmds:
      - go run ./scripts/migrate -url "$PAY_MIGRATE_URL" -dir db/pay/migrations
      - go run ./scripts/migrate -url "$TIX_MIGRATE_URL" -dir db/tickets/migrations
  chaos:
    desc: "Run chaos scenarios, all or one: task chaos -- C4 (P2-04)"
    cmds:
      - 'echo "task chaos: not implemented yet (P2-04)" >&2; exit 1'
